name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  oracle:
    name: Oracle and corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/cache@v6
        with:
          path: .oracle/bin
          key: oracle-${{ runner.os }}-${{ hashFiles('scripts/oracle.sh') }}
      - run: shellcheck scripts/*.sh
      - run: scripts/oracle.sh check
      # Only the oracle writes expected results: regenerating the corpus must change nothing.
      - run: scripts/harvest.sh
      - run: git diff --exit-code -- tests/corpus
