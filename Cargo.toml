[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/icepuma/cuecue"
# No license yet (DECISIONS Q1), so nothing gets published by accident.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
